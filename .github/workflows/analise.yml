name: Análise semanal

on:
  schedule:
    - cron: "0 11 * * 1"   # segunda, 8h em Brasília
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Gerar relatório
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/analise.py
      - name: Guardar relatório
        run: |
          if [ -n "$(git status --porcelain content/analise)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/analise
            git commit -m "Análise semanal [skip ci]"
            git pull -q --rebase origin main
            git push
          fi
