name: Postar no Instagram

# Publica no Instagram, um produto por vez:
# - stories: de hora em hora, das 9h às 21h, e logo depois de cada publicação do site
# - feed: 3 vezes por dia (9h, 13h e 19h), para não lotar o perfil
# Só funciona com os segredos IG_USER_ID e IG_ACCESS_TOKEN cadastrados e com o site fora do modo protótipo.

on:
  workflow_run:
    workflows: ["Publicar site"]
    types: [completed]
  schedule:
    - cron: "7 12-23,0 * * *"     # stories
    - cron: "37 12,16,22 * * *"   # feed
  workflow_dispatch:
    inputs:
      acao:
        description: "testar (só confere o acesso), story ou feed"
        type: choice
        options: [testar, story, feed]
        default: testar

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  postar:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Publicar o próximo produto (ou testar o acesso)
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/instagram.py ${{ github.event.inputs.acao || (github.event.schedule == '37 12,16,22 * * *' && 'feed') || 'story' }}
      - name: Registrar o que foi postado
        run: |
          if [ -n "$(git status --porcelain content/instagram-postados.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/instagram-postados.json
            git commit -m "Registra post no Instagram [skip ci]"
            git push
          fi
