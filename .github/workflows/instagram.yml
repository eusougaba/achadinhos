name: Postar no Instagram

# Publica no Instagram, um produto por vez:
# - stories: no máximo um a cada 50 minutos, das 9h às 21h
# - feed: até 3 por dia, com pelo menos 2h30 de intervalo, das 9h às 20h
# O GitHub atrasa agendamentos, por isso roda a cada 20 minutos e o script decide se publica.
# Só funciona com os segredos IG_USER_ID e IG_ACCESS_TOKEN cadastrados e com o site fora do modo protótipo.

on:
  workflow_run:
    workflows: ["Publicar site"]
    types: [completed]
  schedule:
    - cron: "*/20 12-23,0 * * *"
  workflow_dispatch:
    inputs:
      acao:
        description: "testar (só confere o acesso), story ou feed"
        type: choice
        options: [testar, auto, story, feed, reel]
        default: testar

permissions:
  contents: write
  actions: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  postar:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Publicar o próximo produto (ou testar o acesso)
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/instagram.py ${{ github.event.inputs.acao || 'auto' }}
      - name: Registrar o que foi postado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(git status --porcelain content/instagram-postados.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/instagram-postados.json
            git commit -m "Registra post no Instagram [skip ci]"
            git push
            # republica o site para a página /links mostrar o post novo
            gh workflow run pages.yml --ref main
          fi
