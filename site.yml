# Configuração geral do site. Trocar o nome ou o endereço é só mudar aqui.
nome: Achadoteca
slogan: Os melhores achadinhos, em um só lugar
descricao: >-
  Curadoria de achadinhos do Mercado Livre, Shopee, Amazon e outras lojas:
  produtos interessantes, boas ofertas e o que achamos de cada um.

# Endereço público do site (sem barra no final).
# GitHub Pages sem domínio próprio: https://SEU_USUARIO.github.io/achadinhos
# Com domínio próprio: https://www.seudominio.com.br
url: https://achadoteca.com.br

# Repositório usado pela área admin (/admin) para salvar produtos.
repositorio:
  servico: github        # github ou gitlab
  nome: eusougaba/achadinhos
  branch: main

# Redes (deixe vazio o que ainda não existe)
whatsapp: https://whatsapp.com/channel/0029Vb9XLbVC6ZvZxMo7eA0l
instagram: https://instagram.com/achadoteca.com.br

# Medição de acessos (deixe vazio o que não usar)
google_analytics: "G-3D9P709RR0"      # ID do Google Analytics 4, ex.: G-ABC123XYZ
goatcounter: ""           # código do GoatCounter, ex.: achadoteca (de achadoteca.goatcounter.com)
# Verificação do Google Search Console (só o código do content da meta tag)
google_verificacao: ""

# Enquanto for true, mostra o aviso de protótipo e pede para o Google não indexar.
prototipo: false

# Lojas com programa de afiliados. "em" é como a loja aparece nas frases
# ("Ver no Mercado Livre", "Ver na Shopee"). Para adicionar uma loja, copie um bloco.
lojas:
  - slug: mercadolivre
    nome: Mercado Livre
    em: no Mercado Livre
    hashtag: achadinhosmercadolivre
  - slug: shopee
    nome: Shopee
    em: na Shopee
    hashtag: achadinhosshopee
  - slug: amazon
    nome: Amazon
    em: na Amazon
    hashtag: achadinhosamazon
    sem_preco: true   # a Amazon limita a exibição de preço: o site mostra "veja o preço na loja"
    aviso: "Como Associado da Amazon, ganhamos com compras qualificadas."
  - slug: magalu
    nome: Magalu
    em: na Magalu
    hashtag: achadinhosmagalu
  - slug: aliexpress
    nome: AliExpress
    em: no AliExpress
    hashtag: achadinhosaliexpress

categorias:
  - slug: beleza
    curto: Beleza
    nome: Beleza e cuidados
    hashtags: [beleza, skincare, cabelo, cuidadospessoais, autocuidado]
    descricao: Secadores, modeladores, cuidados com o cabelo e o corpo com bom custo-benefício.
  - slug: moda
    curto: Moda
    nome: Moda e calçados
    hashtags: [moda, look, calcados, estilo, modafeminina]
    descricao: Chinelos, calçados e acessórios com preço bom.
  - slug: casa
    curto: Casa
    nome: Casa e cozinha
    hashtags: [casa, cozinha, decoracaodecasa, utilidadesdomesticas, organizacao]
    descricao: Utilidades para a casa e a cozinha que fazem diferença no dia a dia.
  - slug: esporte
    curto: Esporte
    nome: Esporte e bem-estar
    hashtags: [fitness, treino, suplementos, vidasaudavel, academia]
    descricao: Garrafas, suplementos e acessórios para treino e rotina.
  - slug: tecnologia
    curto: Tecnologia
    nome: Tecnologia
    hashtags: [tecnologia, gadgets, fonedeouvido, smartwatch, eletronicos]
    descricao: Fones, relógios, acessórios e eletrônicos que valem o preço.
  - slug: ferramentas
    curto: Ferramentas
    nome: Ferramentas
    hashtags: [ferramentas, faacavocemesmo, bricolagem, casaeconstrucao]
    descricao: Ferramentas e acessórios para quem gosta de resolver as coisas sozinho.
  - slug: bebes
    curto: Bebês
    nome: Bebês e crianças
    hashtags: [bebe, maternidade, maedeprimeiraviagem, enxovaldebebe, chadebebe]
    descricao: Itens para bebês, crianças e para quem vai ganhar ou dar presente de chá de bebê.
  - slug: pets
    curto: Pets
    nome: Pets
    hashtags: [pets, dog, cachorro, gato, petshop]
    descricao: Caminhas, acessórios e cuidados para cães e gatos.
